<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaconCheatz - Announcements</title>
    <link rel="stylesheet" href="announcement.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="brand-header">
          <img
            src="https://i.ibb.co/1JqpXXW5/image.png"
            alt="BaconCheatz Logo"
            class="brand-logo"
          />
          <span class="brand-name">BaconCheatz</span>
        </div>

        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"
              />
            </svg>
            <span>Scripts</span>
          </a>
          <a href="announcement.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V5h2v6zm0 4h-2v-2h2v2z"
              />
            </svg>
            <span>Announcements</span>
          </a>
          <a href="deobfuscator.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm-1 6h2v2h-2V7zm0 4h2v6h-2v-6z"
              />
            </svg>
            <span>Deobfuscator</span>
          </a>
        </nav>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- ANNOUNCEMENTS TAB -->
        <section class="tab-content active">
          <div class="content-header">
            <div>
              <h1>Announcements & Updates</h1>
              <p class="subtitle">
                Latest news, changelogs, and system status updates.
              </p>
            </div>
          </div>

          <!-- Timeline Container -->
          <div class="timeline-container" id="timeline-container">
            <div class="timeline-loading">
              <div class="spinner"></div>
              <p>Loading announcements...</p>
            </div>
          </div>
        </section>

        <!-- Footer -->
        <footer class="main-footer">
          <span>BaconCheatz 2026©</span>
          <span class="footer-separator">•</span>
          <a
            href="https://discord.gg/vxHSZZSN6"
            target="_blank"
            rel="noopener noreferrer"
            class="discord-link"
            >Discord Invite</a
          >
        </footer>
      </main>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="announcement.js"></script>
  </body>
</html>
